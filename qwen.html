<!DOCTYPE html>                                                                                                                                                
<html lang="en">                                                                                                                                               
<head>                                                                                                                                                         
    <meta charset="UTF-8" />                                                                                                                                     
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />                                                                                     
    <title>Qwen 3.5 Chat Interface</title>                                                                                                                       
    <script src="https://unpkg.com/lucide@latest"></script>                                                                                                      
                                                                                                                                                                
    <style>                                                                                                                                                      
    :root {                                                                                                                                                    
        --sidebar-bg: #1D1D1F;                                                                                                                                   
        --main-bg: #232326;                                                                                                                                      
        --card-bg: #26262a;                                                                                                                                      
        --user-bubble-bg: #2c2c31;                                                                                                                               
        --text-primary: #f0f0f0;                                                                                                                                 
        --text-muted: #8e8e93;                                                                                                                                   
        --border-color: #2b2b2e;                                                                                                                                 
        --blue-accent: #2e5cf6;                                                                                                                                  
        --hover-bg: #28282c;                                                                                                                                     
        --active-chat-bg: #2a2a2e;                                                                                                                               
    }                                                                                                                                                          
                                                                                                                                                                
    * {                                                                                                                                                        
        box-sizing: border-box;                                                                                                                                  
        margin: 0;                                                                                                                                               
        padding: 0;                                                                                                                                              
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    body {                                                                                                                                                     
        background-color: var(--main-bg);                                                                                                                        
        color: var(--text-primary);                                                                                                                              
        height: 100vh;                                                                                                                                           
        display: flex;                                                                                                                                           
        overflow: hidden;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    aside {                                                                                                                                                    
        width: 260px;                                                                                                                                            
        background-color: var(--sidebar-bg);                                                                                                                     
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        justify-content: space-between;                                                                                                                          
        border-right: 1px solid var(--border-color);                                                                                                             
        padding: 12px;                                                                                                                                           
        user-select: none;                                                                                                                                       
        flex-shrink: 0;                                                                                                                                          
        overflow: hidden;                                                                                                                                        
        transition: width 0.25s ease, padding 0.25s ease;                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed {                                                                                                                                          
        width: 58px;                                                                                                                                             
        padding: 12px 8px;                                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    .sidebar-top {                                                                                                                                             
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        gap: 12px;                                                                                                                                               
    }                                                                                                                                                          
                                                                                                                                                                
    .sidebar-header {                                                                                                                                          
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: space-between;                                                                                                                          
        padding: 4px 8px;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .sidebar-header {                                                                                                                          
        justify-content: center;                                                                                                                                 
        padding: 4px 0;                                                                                                                                          
    }                                                                                                                                                          
                                                                                                                                                                
    .brand-logo {                                                                                                                                              
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 8px;                                                                                                                                                
        font-weight: 600;                                                                                                                                        
        font-size: 16px;                                                                                                                                         
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .brand-logo {                                                                                                                              
        display: none;                                                                                                                                           
    }                                                                                                                                                          
                                                                                                                                                                
    .nav-list {                                                                                                                                                
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        gap: 4px;                                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .nav-list {                                                                                                                                
        align-items: center;                                                                                                                                     
        gap: 8px;                                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .nav-item {                                                                                                                                                
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 10px;                                                                                                                                               
        padding: 8px 10px;                                                                                                                                       
        border-radius: 8px;                                                                                                                                      
        color: var(--text-primary);                                                                                                                              
        text-decoration: none;                                                                                                                                   
        font-size: 13.5px;                                                                                                                                       
        cursor: pointer;                                                                                                                                         
        white-space: nowrap;                                                                                                                                     
    }                                                                                                                                                          
                                                                                                                                                                
    .nav-item:hover {                                                                                                                                          
        background-color: var(--hover-bg);                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    .nav-item.disabled {                                                                                                                                       
        opacity: 0.6;                                                                                                                                            
        cursor: not-allowed;                                                                                                                                     
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .nav-item {                                                                                                                                
        width: 40px;                                                                                                                                             
        height: 40px;                                                                                                                                            
        padding: 0;                                                                                                                                              
        justify-content: center;                                                                                                                                 
        gap: 0;                                                                                                                                                  
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .nav-item span {                                                                                                                           
        display: none;                                                                                                                                           
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .nav-item.disabled {                                                                                                                       
        display: none;                                                                                                                                           
    }                                                                                                                                                          
                                                                                                                                                                
    .search-box-container {                                                                                                                                    
        display: none;                                                                                                                                           
        padding: 0 4px;                                                                                                                                          
        margin-top: -4px;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .search-box-container {                                                                                                                    
        display: none !important;                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .search-input-wrapper {                                                                                                                                    
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        background-color: var(--card-bg);                                                                                                                        
        border: 1px solid var(--border-color);                                                                                                                   
        border-radius: 6px;                                                                                                                                      
        padding: 4px 8px;                                                                                                                                        
        gap: 6px;                                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .search-input-wrapper input {                                                                                                                              
        background: transparent;                                                                                                                                 
        border: none;                                                                                                                                            
        outline: none;                                                                                                                                           
        color: var(--text-primary);                                                                                                                              
        font-size: 12.5px;                                                                                                                                       
        width: 100%;                                                                                                                                             
    }                                                                                                                                                          
                                                                                                                                                                
    .sidebar-section-title {                                                                                                                                   
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: space-between;                                                                                                                          
        color: var(--text-muted);                                                                                                                                
        font-size: 12px;                                                                                                                                         
        font-weight: 500;                                                                                                                                        
        padding: 12px 10px 4px;                                                                                                                                  
        white-space: nowrap;                                                                                                                                     
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .sidebar-section-title,                                                                                                                    
    aside.collapsed .history-section {                                                                                                                         
        display: none;                                                                                                                                           
    }                                                                                                                                                          
                                                                                                                                                                
    .history-list {                                                                                                                                            
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        gap: 2px;                                                                                                                                                
        max-height: 240px;                                                                                                                                       
        overflow-y: auto;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    .history-item {                                                                                                                                            
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: space-between;                                                                                                                          
        padding: 8px 10px;                                                                                                                                       
        border-radius: 8px;                                                                                                                                      
        font-size: 13px;                                                                                                                                         
        color: var(--text-primary);                                                                                                                              
        cursor: pointer;                                                                                                                                         
        white-space: nowrap;                                                                                                                                     
        overflow: hidden;                                                                                                                                        
        text-overflow: ellipsis;                                                                                                                                 
    }                                                                                                                                                          
                                                                                                                                                                
    .history-item.active {                                                                                                                                     
        background-color: var(--active-chat-bg);                                                                                                                 
    }                                                                                                                                                          
                                                                                                                                                                
    .history-item:hover {                                                                                                                                      
        background-color: var(--hover-bg);                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    .sidebar-bottom {                                                                                                                                          
        padding-top: 12px;                                                                                                                                       
        border-top: 1px solid var(--border-color);                                                                                                               
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .sidebar-bottom {                                                                                                                          
        border-top: none;                                                                                                                                        
        padding-top: 0;                                                                                                                                          
        display: flex;                                                                                                                                           
        justify-content: center;                                                                                                                                 
    }                                                                                                                                                          
                                                                                                                                                                
    .user-profile {                                                                                                                                            
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 10px;                                                                                                                                               
        padding: 6px 8px;                                                                                                                                        
        border-radius: 8px;                                                                                                                                      
        cursor: pointer;                                                                                                                                         
        white-space: nowrap;                                                                                                                                     
    }                                                                                                                                                          
                                                                                                                                                                
    .user-profile:hover {                                                                                                                                      
        background-color: var(--hover-bg);                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .user-profile {                                                                                                                            
        width: 40px;                                                                                                                                             
        height: 40px;                                                                                                                                            
        padding: 0;                                                                                                                                              
        justify-content: center;                                                                                                                                 
        gap: 0;                                                                                                                                                  
    }                                                                                                                                                          
                                                                                                                                                                
    .avatar {                                                                                                                                                  
        width: 26px;                                                                                                                                             
        height: 26px;                                                                                                                                            
        background-color: #84cc16;                                                                                                                               
        color: #000;                                                                                                                                             
        font-weight: 600;                                                                                                                                        
        font-size: 13px;                                                                                                                                         
        border-radius: 50%;                                                                                                                                      
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: center;                                                                                                                                 
        flex-shrink: 0;                                                                                                                                          
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .avatar {                                                                                                                                  
        width: 28px;                                                                                                                                             
        height: 28px;                                                                                                                                            
    }                                                                                                                                                          
                                                                                                                                                                
    .user-name {                                                                                                                                               
        font-size: 13.5px;                                                                                                                                       
        font-weight: 500;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .user-name {                                                                                                                               
        display: none;                                                                                                                                           
    }                                                                                                                                                          
                                                                                                                                                                
    .main-wrapper {                                                                                                                                            
        flex: 1;                                                                                                                                                 
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        position: relative;                                                                                                                                      
        min-width: 0;                                                                                                                                            
    }                                                                                                                                                          
                                                                                                                                                                
    header {                                                                                                                                                   
        height: 52px;                                                                                                                                            
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: space-between;                                                                                                                          
        padding: 0 16px;                                                                                                                                         
        flex-shrink: 0;                                                                                                                                          
    }                                                                                                                                                          
                                                                                                                                                                
    .header-left {                                                                                                                                             
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 10px;                                                                                                                                               
    }                                                                                                                                                          
                                                                                                                                                                
    .sidebar-toggle-btn {                                                                                                                                      
        background: transparent;                                                                                                                                 
        border: none;                                                                                                                                            
        color: var(--text-muted);                                                                                                                                
        cursor: pointer;                                                                                                                                         
        padding: 4px;                                                                                                                                            
        border-radius: 6px;                                                                                                                                      
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: center;                                                                                                                                 
    }                                                                                                                                                          
                                                                                                                                                                
    .sidebar-toggle-btn:hover {                                                                                                                                
        color: var(--text-primary);                                                                                                                              
        background-color: var(--hover-bg);                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    aside.collapsed .sidebar-toggle-btn {                                                                                                                      
        width: 40px;                                                                                                                                             
        height: 40px;                                                                                                                                            
        padding: 0;                                                                                                                                              
    }                                                                                                                                                          
                                                                                                                                                                
    .model-selector {                                                                                                                                          
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 6px;                                                                                                                                                
        background: transparent;                                                                                                                                 
        border: none;                                                                                                                                            
        color: var(--text-primary);                                                                                                                              
        font-weight: 600;                                                                                                                                        
        font-size: 15px;                                                                                                                                         
        cursor: pointer;                                                                                                                                         
        padding: 6px 8px;                                                                                                                                        
        border-radius: 6px;                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    .model-selector:hover {                                                                                                                                    
        background-color: var(--hover-bg);                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    .header-icons {                                                                                                                                            
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 12px;                                                                                                                                               
        color: var(--text-muted);                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .content-area {                                                                                                                                            
        flex: 1;                                                                                                                                                 
        overflow-y: auto;                                                                                                                                        
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        align-items: center;                                                                                                                                     
        padding: 20px 16px 140px;                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .welcome-container {
        width: 100%;
        max-width: 768px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: auto;
        margin: auto 0;
        padding-top: 0;
    }                                                                                                                                                          
                                                                                                                                                                
    .welcome-title {                                                                                                                                           
        font-size: 32px;                                                                                                                                         
        font-weight: 600;                                                                                                                                        
        margin-bottom: 8px;                                                                                                                                     
        letter-spacing: -0.5px;                                                                                                                                  
        text-align: center;                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    .welcome-input-host {                                                                                                                                      
        width: 100%;                                                                                                                                             
        max-width: 768px;                                                                                                                                        
        margin-top: 20px;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    .bottom-input-host {                                                                                                                                       
        width: 100%;                                                                                                                                             
        max-width: 768px;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    .chat-container {                                                                                                                                          
        width: 100%;                                                                                                                                             
        max-width: 768px;                                                                                                                                        
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        gap: 24px;                                                                                                                                               
    }                                                                                                                                                          
                                                                                                                                                                
    .user-msg-row {                                                                                                                                            
        display: flex;                                                                                                                                           
        justify-content: flex-end;                                                                                                                               
    }                                                                                                                                                          
                                                                                                                                                                
    .user-bubble {                                                                                                                                             
        background-color: var(--user-bubble-bg);                                                                                                                 
        color: var(--text-primary);                                                                                                                              
        padding: 10px 18px;                                                                                                                                      
        border-radius: 18px;                                                                                                                                     
        font-size: 14.5px;                                                                                                                                       
        max-width: 80%;                                                                                                                                          
        line-height: 1.4;                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    .assistant-msg-row {                                                                                                                                       
        display: flex;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        align-items: flex-start;                                                                                                                                 
        gap: 10px;                                                                                                                                               
    }                                                                                                                                                          
                                                                                                                                                                
    .thinking-status {                                                                                                                                         
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 6px;                                                                                                                                                
        color: var(--text-muted);                                                                                                                                
        font-size: 13px;                                                                                                                                         
        cursor: pointer;                                                                                                                                         
        user-select: none;                                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    .thinking-status.loading {                                                                                                                                 
        color: var(--text-primary);                                                                                                                              
    }                                                                                                                                                          
                                                                                                                                                                
    .thinking-status:hover {                                                                                                                                   
        color: var(--text-primary);                                                                                                                              
    }                                                                                                                                                          
                                                                                                                                                                
    .spin-icon {                                                                                                                                               
        animation: spin 1.2s linear infinite;                                                                                                                    
    }                                                                                                                                                          
                                                                                                                                                                
    @keyframes spin {                                                                                                                                          
        0% { transform: rotate(0deg); }                                                                                                                          
        100% { transform: rotate(360deg); }                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    .assistant-text {                                                                                                                                          
        font-size: 15px;                                                                                                                                         
        line-height: 1.6;                                                                                                                                        
        color: var(--text-primary);                                                                                                                              
        white-space: pre-wrap;                                                                                                                                   
    }                                                                                                                                                          
                                                                                                                                                                
    .action-bar {                                                                                                                                              
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 10px;                                                                                                                                               
        margin-top: 4px;                                                                                                                                         
        color: var(--text-muted);                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .action-bar button {                                                                                                                                       
        background: transparent;                                                                                                                                 
        border: none;                                                                                                                                            
        color: var(--text-muted);                                                                                                                                
        cursor: pointer;                                                                                                                                         
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: center;                                                                                                                                 
        padding: 4px;                                                                                                                                            
        border-radius: 4px;                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    .action-bar button:hover {                                                                                                                                 
        color: var(--text-primary);                                                                                                                              
        background-color: var(--hover-bg);                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    .bottom-dock {                                                                                                                                             
        position: absolute;                                                                                                                                      
        bottom: 0;                                                                                                                                               
        left: 0;                                                                                                                                                 
        right: 0;                                                                                                                                                
        background: linear-gradient(180deg, transparent 0%, var(--main-bg) 40%);                                                                                 
        display: none;                                                                                                                                           
        flex-direction: column;                                                                                                                                  
        align-items: center;                                                                                                                                     
        padding: 0 16px 12px;                                                                                                                                    
        gap: 8px;                                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .input-box {                                                                                                                                               
        width: 100%;                                                                                                                                             
        max-width: 768px;                                                                                                                                        
        background-color: var(--card-bg);                                                                                                                        
        border: 1px solid var(--border-color);                                                                                                                   
        border-radius: 28px;                                                                                                                                     
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        padding: 6px 10px 6px 12px;                                                                                                                              
    }                                                                                                                                                          
                                                                                                                                                                
    .plus-btn {                                                                                                                                                
        background: transparent;                                                                                                                                 
        border: none;                                                                                                                                            
        color: var(--text-muted);                                                                                                                                
        cursor: not-allowed;                                                                                                                                     
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: center;
