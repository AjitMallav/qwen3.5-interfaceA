        padding: 6px;                                                                                                                                            
        border-radius: 50%;                                                                                                                                      
        opacity: 0.6;                                                                                                                                            
    }                                                                                                                                                          
                                                                                                                                                                
    .chat-input {                                                                                                                                              
        flex: 1;                                                                                                                                                 
        background: transparent;                                                                                                                                 
        border: none;                                                                                                                                            
        outline: none;                                                                                                                                           
        color: var(--text-primary);                                                                                                                              
        font-size: 14.5px;                                                                                                                                       
        padding: 8px 12px;                                                                                                                                       
        min-width: 0;                                                                                                                                            
    }                                                                                                                                                          
                                                                                                                                                                
    .chat-input::placeholder {                                                                                                                                 
        color: var(--text-muted);                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .input-controls {                                                                                                                                          
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 8px;                                                                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    .auto-dropdown {                                                                                                                                           
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        gap: 4px;                                                                                                                                                
        color: var(--text-muted);                                                                                                                                
        font-size: 12px;                                                                                                                                         
        cursor: pointer;                                                                                                                                         
        padding: 4px 8px;                                                                                                                                        
        border-radius: 12px;                                                                                                                                     
    }                                                                                                                                                          
                                                                                                                                                                
    .auto-dropdown:hover {                                                                                                                                     
        background-color: var(--hover-bg);                                                                                                                       
        color: var(--text-primary);                                                                                                                              
    }                                                                                                                                                          
                                                                                                                                                                
    .icon-circle-btn {                                                                                                                                         
        background-color: transparent;                                                                                                                           
        border: none;                                                                                                                                            
        color: var(--text-muted);                                                                                                                                
        width: 32px;                                                                                                                                             
        height: 32px;                                                                                                                                            
        border-radius: 50%;                                                                                                                                      
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: center;                                                                                                                                 
        cursor: pointer;                                                                                                                                         
    }                                                                                                                                                          
                                                                                                                                                                
    .icon-circle-btn:hover {                                                                                                                                   
        color: var(--text-primary);                                                                                                                              
        background-color: var(--hover-bg);                                                                                                                       
    }                                                                                                                                                          
                                                                                                                                                                
    .icon-circle-btn.listening {                                                                                                                               
        color: #ef4444;                                                                                                                                          
        animation: pulse 1.5s infinite;                                                                                                                          
    }                                                                                                                                                          
                                                                                                                                                                
    @keyframes pulse {                                                                                                                                         
        0% { transform: scale(1); }                                                                                                                              
        50% { transform: scale(1.15); }                                                                                                                          
        100% { transform: scale(1); }                                                                                                                            
    }                                                                                                                                                          
                                                                                                                                                                
    .send-btn {                                                                                                                                                
        background-color: var(--blue-accent);                                                                                                                    
        border: none;                                                                                                                                            
        color: #ffffff;                                                                                                                                          
        width: 32px;                                                                                                                                             
        height: 32px;                                                                                                                                            
        border-radius: 50%;                                                                                                                                      
        display: flex;                                                                                                                                           
        align-items: center;                                                                                                                                     
        justify-content: center;

    lucide.createIcons();

    const sharedInputBox = document.getElementById('shared-input-box');                                                                                        
    const welcomeInputHost = document.getElementById('welcome-input-host');                                                                                    
    const bottomInputHost = document.getElementById('bottom-input-host');                                                                                      
                                                                                                                                                                
    const presetResponses = [                                                                                                                                  
        {                                                                                                                                                        
        trigger: "Write a short, comforting conversation between an old mentor and a student who is ready to give up.",                                        
        response: `**Setting:** *An old garden bench overlooking a quiet lake at dusk. The air is cool, but the water shimmers with gold light.*               
                                                                                                                                                                
**Mentor:** "You look like you've seen the end of the world. It's not a bad place to sit, though."                                                             
                                                                                                                                                                
**Student:** "It's just... I can't do it anymore, Mr. Halloway. The steps, the forms, the endless repetition. My hands are shaking, and my mind is foggy. Why  
bother if no one will ever know the difference?"                                                                                                                 
                                                                                                                                                                
**Mentor:** *(Gently placing a weathered hand on the student's shoulder)* "Ah, the fog. It's heavy tonight. But remember what we talked about when you first   
arrived? You asked me why I still brush the same stones every morning, even when they're smooth."                                                                
                                                                                                                                                                
**Student:** "Because they need polishing? To keep them shiny?"                                                                                                
                                                                                                                                                                
**Mentor:** "No. Because the act *is* the point. When your hands shake, that tremor isn't a failure; it's the rhythm of your patience. It tells me you are     
still here, still trying. If you stop, the stone stays rough. But if you continue, even slowly, you teach it beauty. And more importantly..." *(He leans         
forward, eyes twinkling)* "...you teach yourself how to be gentle with your own heart."                                                                          
                                                                                                                                                                
**Student:** "I'm so tired of being gentle with myself."                                                                                                       
                                                                                                                                                                
**Mentor:** "Then let us be gentle together. Take three breaths. Not for perfection, but for presence. Just breathe. The mountain doesn't care if you climb in 
one day or ten years. It only cares that you don't stop walking."                                                                                                
                                                                                                                                                                
**Student:** *(Taking a deep, shaky breath)* "Okay. Just one step. One slow step."                                                                             
                                                                                                                                                                
**Mentor:** "That is enough. Now, walk."`,                                                                                                                     
        durationSec: 29.57                                                                                                                                     
        },                                                                                                                                                       
        {                                                                                                                                                        
        trigger: "Write a brief, urgent Slack message asking teammates to hop onto a bridge call to fix a sudden production crash.",                           
        response: `🚨 **URGENT: Production Crash Detected!** 🚨                                                                                                
                                                                                                                                                                
Our service just went down. We need to jump on the bridge call immediately to triage and fix this ASAP.                                                        
                                                                                                                                                                
Link: [Insert Call Link]                                                                                                                                       
                                                                                                                                                                
Let's get this running again! 💥➡️✅`,                                                                                                                         
        durationSec: 6.21                                                                                                                                      
        },                                                                                                                                                       
        {                                                                                                                                                        
        trigger: "Describe a newly proposed product feature in a short paragraph for an internal engineering documentation header.",                           
        response: `**New Feature: Adaptive Context-Aware Latency Optimization**                                                                                
                                                                                                                                                                
This update introduces a dynamic runtime engine that automatically adjusts inference parameters based on real-time network conditions and device capabilities. 
                                                                                                                                                                
Unlike static configuration, this system predicts throughput bottlenecks before they occur, dynamically shifting from high-fidelity processing to optimized    
streaming modes to maintain consistent user experience across heterogeneous hardware environments without manual intervention.`,                                 
        durationSec: 6.87                                                                                                                                      
        },                                                                                                                                                       
        {                                                                                                                                                        
        trigger: "Write a brief, tense exchange between two characters who are subtly trying to outsmart each other.",                                         
        response: `"Your bid was low," Elias said, not looking up from his ledger. "And the terms... generous for someone who clearly didn't read the fine     
print."                                                                                                                                                          
                                                                                                                                                                
Sarah's fingers tightened around her pen until the ink bled through the paper. "The fine print is where the risk lies, Elias. Everyone knows that."            
                                                                                                                                                                
"Everyone," he repeated, finally lifting his gaze. His eyes were cold, assessing. "Except those who've already calculated the variable you're afraid to        
mention."                                                                                                                                                        
                                                                                                                                                                
Sarah's breath hitched. "What variable?"                                                                                                                       
                                                                                                                                                                
"The one that makes this a win-win," Elias whispered, leaning back as if the game were over, "and not a trap."                                                 
                                                                                                                                                                
She set the pen down. The silence stretched, heavy and electric. "Careful, Elias. I'd hate for you to realize how much you've already lost."                   
                                                                                                                                                                
"Good luck guessing my next move before the auction ends," he replied, smiling without warmth. "But I'll be watching your portfolio, just as you'll watch      
mine."`,                                                                                                                                                         
        durationSec: 18.12                                                                                                                                     
        },                                                                                                                                                       
        {                                                                                                                                                        
        trigger: "Write a brief, encouraging announcement message for a team channel celebrating a successful project launch.",                                
        response: `🚀 **Huge Success!** 🎉                                                                                                                     
                                                                                                                                                                
We just officially launched our new project! This milestone wouldn't be possible without your incredible dedication, creativity, and teamwork.                 
                                                                                                                                                                
To the team: thank you for pushing through challenges and celebrating small wins. You've done an amazing job!                                                  
                                                                                                                                                                
Let's keep this momentum going—next big thing is next! 💪✨`,                                                                                                  
        durationSec: 7.00                                                                                                                                      
        },                                                                                                                                                       
        {                                                                                                                                                        
        trigger: "Write a sharp argument between a historical scientist and a skeptical assistant regarding a new discovery.",                                 
        response: `**Setting:** *A cluttered laboratory late at night. The air hums with the low vibration of a particle accelerator. Dr. Aris Thorne holds a  
trembling vial containing a faint, iridescent glow. Below him, Assistant Jalen paces nervously, eyes darting between the data logs and Thorne's face.*           
                                                                                                                                                                
**Thorne:** (Without looking up) It's not magic, Jalen. It's thermodynamics we forgot how to calculate. Look at the isotope decay in Sector 4. It's happening  
in reverse.                                                                                                                                                      
                                                                                                                                                                
**Jalen:** Reverse? Sir, that violates the Second Law of Thermodynamics! You're claiming energy is being extracted from nothingness. If we publish this, the   
entire field of astrophysics collapses overnight. Who do you think will believe it?                                                                              
                                                                                                                                                                
**Thorne:** Or who will believe us if we don't? You're looking for chaos; I'm looking for order hidden in the noise. This isn't extraction, Jalen. It's        
*recycling*. We've found a mechanism that converts high-entropy radiation back into usable mass without waste. It's the key to clean fusion, Jalen. No more      
nuclear waste, no more dead stars. Just... renewal.                                                                                                              
                                                                                                                                                                
**Jalen:** Renewal? That's wishful thinking wrapped in a lab coat! Look at the error margins. The background radiation spikes are erratic. If you run this     
again tomorrow, it might just blow the reactor core`,                                                                                                            
        durationSec: 25.74                                                                                                                                     
        }                                                                                                                                                        
    ];                                                                                                                                                         
                                                                                                                                                                
    let chatSessions = [];                                                                                                                                     
    let currentChatId = null;                                                                                                                                  
    let isGenerating = false;                                                                                                                                  
    let streamAnimationFrame = null;                                                                                                                           
    let currentStream = null;                                                                                                                                  
    let recognition = null;                                                                                                                                    
                                                                                                                                                                
    closeSidebarBtn.addEventListener('click', () => {                                                                                                          
        setSidebarCollapsed(!sidebar.classList.contains('collapsed'));                                                                                           
    });                                                                                                                                                        
                                                                                                                                                                
    function setSidebarCollapsed(collapsed) {                                                                                                                  
        sidebar.classList.toggle('collapsed', collapsed);                                                                                                        
                                                                                                                                                                
        closeSidebarBtn.title = collapsed ? 'Expand Sidebar' : 'Collapse Sidebar';                                                                               
        closeSidebarBtn.innerHTML = collapsed                                                                                                                    
        ? `<i data-lucide="panel-left-open" size="18"></i>`                                                                                                    
        : `<i data-lucide="panel-left-close" size="18"></i>`;                                                                                                  
                                                                                                                                                                
        if (collapsed) {                                                                                                                                         
        searchBoxContainer.style.display = 'none';                                                                                                             
        searchInput.value = '';                                                                                                                                
        renderHistoryList();                                                                                                                                   
        }                                                                                                                                                        
                                                                                                                                                                
        lucide.createIcons();                                                                                                                                    
    }                                                                                                                                                          
                                                                                                                                                                
    searchChatsBtn.addEventListener('click', () => {                                                                                                           
        if (sidebar.classList.contains('collapsed')) {                                                                                                           
        setSidebarCollapsed(false);                                                                                                                            
        }                                                                                                                                                        
                                                                                                                                                                
        const isVisible = searchBoxContainer.style.display === 'block';                                                                                          
        searchBoxContainer.style.display = isVisible ? 'none' : 'block';                                                                                         
                                                                                                                                                                
        if (!isVisible) {                                                                                                                                        
        searchInput.focus();                                                                                                                                   
        } else {                                                                                                                                                 
        searchInput.value = '';                                                                                                                                
        renderHistoryList();                                                                                                                                   
        }                                                                                                                                                        
    });                                                                                                                                                        
                                                                                                                                                                
    searchInput.addEventListener('input', () => {                                                                                                              
        renderHistoryList(searchInput.value.toLowerCase().trim());                                                                                               
    });                                                                                                                                                        
                                                                                                                                                                
    input.addEventListener('input', () => {                                                                                                                    
        if (!isGenerating) {                                                                                                                                     
        actionBtn.disabled = input.value.trim().length === 0;                                                                                                  
        }                                                                                                                                                        
    });                                                                                                                                                        
                                                                                                                                                                
    input.addEventListener('keydown', (e) => {                                                                                                                 
        if (e.key === 'Enter' && !actionBtn.disabled && !isGenerating) {                                                                                         
        handleSend();                                                                                                                                          
        }                                                                                                                                                        
    });                                                                                                                                                        
                                                                                                                                                                
    actionBtn.addEventListener('click', () => {                                                                                                                
        if (isGenerating) {                                                                                                                                      
        stopGeneration();                                                                                                                                      
        } else if (input.value.trim().length > 0) {                                                                                                              
        handleSend();                                                                                                                                          
        }                                                                                                                                                        
    });                                                                                                                                                        
                                                                                                                                                                
    newChatBtn.addEventListener('click', createNewChatSession);                                                                                                
                                                                                                                                                                
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {                                                                                
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;                                                                    
        recognition = new SpeechRecognition();                                                                                                                   
        recognition.continuous = false;                                                                                                                          
        recognition.interimResults = true;                                                                                                                       
                                                                                                                                                                
        recognition.onstart = () => voiceBtn.classList.add('listening');                                                                                         
                                                                                                                                                                
        recognition.onresult = (event) => {                                                                                                                      
        let transcript = '';                                                                                                                                   
                                                                                                                                                                
        for (let i = event.resultIndex; i < event.results.length; i++) {                                                                                       
            transcript += event.results[i][0].transcript;                                                                                                        
        }                                                                                                                                                      
                                                                                                                                                                
        input.value = transcript;                                                                                                                              
        actionBtn.disabled = input.value.trim().length === 0;                                                                                                  
        };                                                                                                                                                       
                                                                                                                                                                
        recognition.onerror = () => voiceBtn.classList.remove('listening');                                                                                      
        recognition.onend = () => voiceBtn.classList.remove('listening');                                                                                        
                                                                                                                                                                
        voiceBtn.addEventListener('click', () => {                                                                                                               
        if (voiceBtn.classList.contains('listening')) {                                                                                                        
            recognition.stop();                                                                                                                                  
        } else {                                                                                                                                               
            recognition.start();                                                                                                                                 
        }                                                                                                                                                      
        });                                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    function handleSend() {                                                                                                                                    
        const prompt = input.value.trim();                                                                                                                       
        if (!prompt || isGenerating) return;                                                                                                                     
                                                                                                                                                                
        if (!currentChatId) {                                                                                                                                    
        const titleSnippet = prompt.length > 22 ? prompt.substring(0, 22) + '...' : prompt;                                                                    
                                                                                                                                                                
        const newSession = {                                                                                                                                   
            id: Date.now(),                                                                                                                                      
            title: titleSnippet,                                                                                                                                 
            messages: []                                                                                                                                         
        };                                                                                                                                                     
                                                                                                                                                                
        chatSessions.unshift(newSession);                                                                                                                      
        currentChatId = newSession.id;                                                                                                                         
        renderHistoryList();                                                                                                                                   
        }                                                                                                                                                        
                                                                                                                                                                
        const activeSession = chatSessions.find(s => s.id === currentChatId);                                                                                    
        activeSession.messages.push({ role: 'user', content: prompt });                                                                                          
                                                                                                                                                                
        const matched = presetResponses.find(                                                                                                                    
        p => p.trigger.toLowerCase() === prompt.toLowerCase()                                                                                                  
        );                                                                                                                                                       
                                                                                                                                                                
        let textToStream = "";                                                                                                                                   
        let durationSec = 3.00;                                                                                                                                  
                                                                                                                                                                
        if (matched) {                                                                                                                                           
        textToStream = matched.response;                                                                                                                       
        durationSec = matched.durationSec;                                                                                                                     
        } else {                                                                                                                                                 
        textToStream = `Offline response generated for: "${prompt}" using hardcoded Qwen3.5-4B mockup engine.`;                                                
        durationSec = 3.00;                                                                                                                                    
        }                                                                                                                                                        
                                                                                                                                                                
        isGenerating = true;                                                                                                                                     
                                                                                                                                                                
        currentStream = {                                                                                                                                        
        chatId: currentChatId,                                                                                                                                 
        text: textToStream,                                                                                                                                    
        durationSec: durationSec,                                                                                                                              
        startTime: null                                                                                                                                        
        };                                                                                                                                                       
                                                                                                                                                                
        renderActiveChat();                                                                                                                                      
        startStreaming(textToStream, durationSec, currentChatId);                                                                                                
    }                                                                                                                                                          
                                                                                                                                                                
    function renderActiveChat() {                                                                                                                              
        welcomeScreen.style.display = 'none';                                                                                                                    
        chatContainer.style.display = 'flex';                                                                                                                    
        disclaimer.style.display = 'block';                                                                                                                      
        bottomDock.style.display = 'flex';                                                                                                                       
                                                                                                                                                                
        if (!bottomInputHost.contains(sharedInputBox)) {                                                                                                         
        bottomInputHost.appendChild(sharedInputBox);                                                                                                           
        }                                                                                                                                                        
                                                                                                                                                                
        const activeSession = chatSessions.find(s => s.id === currentChatId);                                                                                    
        if (!activeSession) return;                                                                                                                              
                                                                                                                                                                
        chatContainer.innerHTML = '';                                                                                                                            
                                                                                                                                                                
        activeSession.messages.forEach((msg) => {                                                                                                                
        if (msg.role === 'user') {                                                                                                                             
            chatContainer.innerHTML += `                                                                                                                         
            <div class="user-msg-row">                                                                                                                         
                <div class="user-bubble">${escapeHtml(msg.content)}</div>                                                                                        
            </div>`;                                                                                                                                           
        } else {                                                                                                                                               
            chatContainer.innerHTML += `                                                                                                                         
            <div class="assistant-msg-row">                                                                                                                    
                <div class="thinking-status">                                                                                                                    
                <i data-lucide="lightbulb" size="15"></i>                                                                                                      
                <span>Thought for ${msg.durationSec ? msg.durationSec.toFixed(2) : '0.00'}s</span>                                                             
                <i data-lucide="chevron-right" size="14"></i>                                                                                                  
                </div>                                                                                                                                           
                                                                                                                                                                
                <div class="assistant-text">${escapeHtml(msg.content)}</div>                                                                                     
                                                                                                                                                                
                <div class="action-bar">                                                                                                                         
                <button title="Copy"><i data-lucide="copy" size="15"></i></button>                                                                             
                <button title="Thumbs up"><i data-lucide="thumbs-up" size="15"></i></button>                                                                   
                <button title="Thumbs down"><i data-lucide="thumbs-down" size="15"></i></button>                                                               
                <button title="Share"><i data-lucide="share" size="15"></i></button>                                                                           
                <button title="Retry"><i data-lucide="rotate-cw" size="15"></i></button>                                                                       
                </div>                                                                                                                                           
            </div>`;                                                                                                                                           
        }                                                                                                                                                      
        });                                                                                                                                                      
                                                                                                                                                                
        if (isGenerating && currentStream && currentStream.chatId === currentChatId) {                                                                           
        chatContainer.innerHTML += `                                                                                                                           
            <div class="assistant-msg-row">                                                                                                                      
            <div class="thinking-status loading">                                                                                                              
                <i data-lucide="loader-2" class="spin-icon" size="15"></i>                                                                                       
                <span>Thinking... (<span id="live-timer">0.00s</span>)</span>                                                                                    
            </div>                                                                                                                                             
                                                                                                                                                                
            <div class="assistant-text" id="stream-target"></div>                                                                                              
            </div>`;                                                                                                                                             
        }                                                                                                                                                        
                                                                                                                                                                
        lucide.createIcons();                                                                                                                                    
        scrollToBottom();                                                                                                                                        
    }                                                                                                                                                          
                                                                                                                                                                
    function startStreaming(textToStream, targetDurationSec, chatId) {                                                                                         
        input.value = '';                                                                                                                                        
        actionBtn.disabled = false;                                                                                                                              
        actionBtn.className = 'send-btn streaming';                                                                                                              
        actionBtn.innerHTML = `<i data-lucide="square" size="12" fill="#ffffff"></i>`;                                                                           
        lucide.createIcons();                                                                                                                                    
                                                                                                                                                                
        const durationMs = Math.max(targetDurationSec * 1000, 1);                                                                                                
        const startTime = performance.now();                                                                                                                     
                                                                                                                                                                
        if (currentStream) {                                                                                                                                     
        currentStream.startTime = startTime;                                                                                                                   
        }                                                                                                                                                        
                                                                                                                                                                
        function frame(now) {                                                                                                                                    
        if (!isGenerating || !currentStream || currentStream.chatId !== chatId) return;                                                                        
                                                                                                                                                                
        const elapsedMs = now - startTime;                                                                                                                     
        const progress = Math.min(elapsedMs / durationMs, 1);                                                                                                  
        const charCount = Math.floor(progress * textToStream.length);                                                                                          
                                                                                                                                                                
        const target = document.getElementById('stream-target');                                                                                               
                                                                                                                                                                
        if (target) {                                                                                                                                          
            target.textContent = textToStream.slice(0, charCount);                                                                                               
        }                                                                                                                                                      
                                                                                                                                                                
        const timerDisplay = document.getElementById('live-timer');                                                                                            
                                                                                                                                                                
        if (timerDisplay) {                                                                                                                                    
            const elapsedSec = Math.min(elapsedMs / 1000, targetDurationSec);                                                                                    
            timerDisplay.textContent = `${elapsedSec.toFixed(2)}s`;                                                                                              
        }                                                                                                                                                      
                                                                                                                                                                
        scrollToBottom();                                                                                                                                      
                                                                                                                                                                
        if (progress < 1) {                                                                                                                                    
            streamAnimationFrame = requestAnimationFrame(frame);                                                                                                 
        } else {                                                                                                                                               
            completeGeneration(textToStream, targetDurationSec, chatId);                                                                                         
        }                                                                                                                                                      
        }                                                                                                                                                        
                                                                                                                                                                
        streamAnimationFrame = requestAnimationFrame(frame);                                                                                                     
    }                                                                                                                                                          
                                                                                                                                                                
    function completeGeneration(textToStream, durationSec, chatId) {                                                                                           
        if (streamAnimationFrame) {                                                                                                                              
        cancelAnimationFrame(streamAnimationFrame);                                                                                                            
        streamAnimationFrame = null;                                                                                                                           
        }                                                                                                                                                        
                                                                                                                                                                
        const activeSession = chatSessions.find(s => s.id === chatId);                                                                                           
                                                                                                                                                                
        if (activeSession) {                                                                                                                                     
        activeSession.messages.push({                                                                                                                          
            role: 'assistant',                                                                                                                                   
            content: textToStream,                                                                                                                               
            durationSec: durationSec                                                                                                                             
        });                                                                                                                                                    
        }                                                                                                                                                        
                                                                                                                                                                
        currentStream = null;                                                                                                                                    
        isGenerating = false;                                                                                                                                    
        resetActionButton();                                                                                                                                     
        renderActiveChat();                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    function stopGeneration() {                                                                                                                                
        if (streamAnimationFrame) {                                                                                                                              
        cancelAnimationFrame(streamAnimationFrame);                                                                                                            
        streamAnimationFrame = null;                                                                                                                           
        }                                                                                                                                                        
                                                                                                                                                                
        if (currentStream) {                                                                                                                                     
        const target = document.getElementById('stream-target');                                                                                               
        const partialText = target ? target.textContent : '';                                                                                                  
                                                                                                                                                                
        let elapsedSec = 0;                                                                                                                                    
                                                                                                                                                                
        if (currentStream.startTime) {                                                                                                                         
            elapsedSec = Math.min(                                                                                                                               
            (performance.now() - currentStream.startTime) / 1000,                                                                                              
            currentStream.durationSec                                                                                                                          
            );                                                                                                                                                   
        }                                                                                                                                                      
                                                                                                                                                                
        const activeSession = chatSessions.find(s => s.id === currentStream.chatId);                                                                           
                                                                                                                                                                
        if (activeSession && partialText.trim().length > 0) {                                                                                                  
            activeSession.messages.push({                                                                                                                        
            role: 'assistant',                                                                                                                                 
            content: partialText,                                                                                                                              
            durationSec: elapsedSec                                                                                                                            
            });                                                                                                                                                  
        }                                                                                                                                                      
        }
