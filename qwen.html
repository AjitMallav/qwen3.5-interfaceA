        currentStream = null;                                                                                                                                    
        isGenerating = false;                                                                                                                                    
        resetActionButton();                                                                                                                                     
        renderActiveChat();                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    function resetActionButton() {                                                                                                                             
        actionBtn.className = 'send-btn';                                                                                                                        
        actionBtn.disabled = input.value.trim().length === 0;                                                                                                    
        actionBtn.innerHTML = `<i data-lucide="arrow-up" size="16"></i>`;                                                                                        
        lucide.createIcons();                                                                                                                                    
    }                                                                                                                                                          
                                                                                                                                                                
    function renderHistoryList(filterQuery = '') {                                                                                                             
        historyList.innerHTML = '';                                                                                                                              
                                                                                                                                                                
        const filtered = chatSessions.filter(session =>                                                                                                          
        session.title.toLowerCase().includes(filterQuery)                                                                                                      
        );                                                                                                                                                       
                                                                                                                                                                
        if (filtered.length === 0) {                                                                                                                             
        historyList.innerHTML = `<div style="font-size:12px; color:var(--text-muted); padding:6px 10px;">No chats found</div>`;                                
        return;                                                                                                                                                
        }                                                                                                                                                        
                                                                                                                                                                
        filtered.forEach(session => {                                                                                                                            
        const item = document.createElement('div');                                                                                                            
        item.className = `history-item ${session.id === currentChatId ? 'active' : ''}`;                                                                       
        item.onclick = () => switchChatSession(session.id);                                                                                                    
                                                                                                                                                                
        item.innerHTML = `                                                                                                                                     
            <span>${escapeHtml(session.title)}</span>                                                                                                            
            <i data-lucide="more-horizontal" size="14" style="color: var(--text-muted);"></i>                                                                    
        `;                                                                                                                                                     
                                                                                                                                                                
        historyList.appendChild(item);                                                                                                                         
        });                                                                                                                                                      
                                                                                                                                                                
        lucide.createIcons();                                                                                                                                    
    }                                                                                                                                                          
                                                                                                                                                                
    function switchChatSession(id) {                                                                                                                           
        if (isGenerating) stopGeneration();                                                                                                                      
                                                                                                                                                                
        currentChatId = id;                                                                                                                                      
        renderHistoryList(searchInput.value.toLowerCase().trim());                                                                                               
        renderActiveChat();                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    function createNewChatSession() {                                                                                                                          
        if (isGenerating) stopGeneration();                                                                                                                      
                                                                                                                                                                
        currentChatId = null;                                                                                                                                    
        welcomeScreen.style.display = 'flex';                                                                                                                    
        chatContainer.style.display = 'none';                                                                                                                    
        disclaimer.style.display = 'none';                                                                                                                       
        bottomDock.style.display = 'none';                                                                                                                       
        chatContainer.innerHTML = '';                                                                                                                            
                                                                                                                                                                
        if (!welcomeInputHost.contains(sharedInputBox)) {                                                                                                        
        welcomeInputHost.appendChild(sharedInputBox);                                                                                                          
        }                                                                                                                                                        
                                                                                                                                                                
        input.value = '';                                                                                                                                        
        actionBtn.disabled = true;                                                                                                                               
                                                                                                                                                                
        renderHistoryList(searchInput.value.toLowerCase().trim());                                                                                               
        lucide.createIcons();                                                                                                                                    
    }                                                                                                                                                          
                                                                                                                                                                
    function scrollToBottom() {                                                                                                                                
        requestAnimationFrame(() => {                                                                                                                            
        contentArea.scrollTop = contentArea.scrollHeight;                                                                                                      
        });                                                                                                                                                      
    }                                                                                                                                                          
                                                                                                                                                                
    function escapeHtml(str) {                                                                                                                                 
        return str.replace(/[&<>"']/g, (m) => ({                                                                                                                 
        '&': '&amp;',                                                                                                                                          
        '<': '&lt;',                                                                                                                                           
        '>': '&gt;',                                                                                                                                           
        '"': '&quot;',                                                                                                                                         
        "'": '&#039;'                                                                                                                                          
        })[m]);                                                                                                                                                  
    }                                                                                                                                                          
                                                                                                                                                                
    renderHistoryList();                                                                                                                                       
    </script>                                                                                                                                                    
</body>                                                                                                                                                        
</html>
